# Varsling: Slack via GitHub Actions Secrets (ingen URL i git).
# Sett NOTIFICATION_SLACK=true og NOTIFICATION_SLACK_WEBHOOK_URL til webhook-URL.
# Devora runbook bruker navnet SLACK_WEBHOOK_URL for samme hemmelighet — se docs/runbook-status.md.
